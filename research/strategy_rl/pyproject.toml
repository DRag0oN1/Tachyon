[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tachyon-strategy-rl"
version = "0.1.0"
description = "Isolated strategy-first abstract robotics PPO experiment"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.10.0", "numpy==2.3.5"]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[project.scripts]
tachyon-strategy-rl = "tachyon_strategy_rl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tachyon_strategy_rl*"]

[tool.setuptools.package-data]
tachyon_strategy_rl = ["scenario.json", "strategy.schema.json", "strategy-v2.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

